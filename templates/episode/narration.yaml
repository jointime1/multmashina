# Реплики по битам (идентификаторы — латиницей: это имена файлов). Бит — одна реплика и картинка к ней. Метки [[имя]] ставьте перед словом, на которое должна «попасть» картинка:
# в сцене время этого слова вернёт m('имя'). Говорят примерно 2,5 слова в секунду: хук — не больше 5 слов.
биты:
  hook: "[[a]]Привет, [[b]]мир."
  middle: "Это второй бит, и [[c]]тут что-то происходит."
  outro: "[[d]]Подписывайтесь."
