# Эпизод «{{название}}». Подробности по ключам — docs/styles.md и docs/voice.md.
название: "{{название}}"
стиль: {{стиль}}                 # styles/<имя>.yaml; можно положить свой стиль в styles/ рядом с эпизодом
скрипты: [scenes.js]             # файлы эпизода, подключаются после движка по порядку

озвучка:
  бэкенд: edge                   # edge (где есть интернет) | qwen-клон | qwen-дизайн | chatterbox
  голос: ru-RU-DmitryNeural      # голос Edge: ru-RU-DmitryNeural (мужской) или ru-RU-SvetlanaNeural (женский)
  скорость: "+10%"
  темп: 1.0                      # дополнительное ускорение готовой записи без смены высоты

# Герои эпизода. Новых героев добавляйте сюда: кожа, волосы, очки, пиджак, кепка… (docs/styles.md)
герои:
  главный: {очки: true}

# Свои комнаты поверх стиля (необязательно):
# комнаты:
#   кухня: {стена: "#3b4659", пол: "#232735", свет: "#ffb347"}

субтитры:
  замены: {}                     # как слово произносится → как показывать в субтитрах, например {сиио: CEO}
