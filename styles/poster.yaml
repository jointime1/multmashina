# Стиль «Плакат»: яркие плоские цвета и жирный контур, как на трафаретном плакате. Резкая ступенчатая анимация, без зерна и виньетки.
название: Плакат

палитра:
  тёмный: "#1b1442"
  светлый: "#fff3d6"
  красный: "#ff3b30"
  акцент: "#00b3a4"
  приглушённый: "#a78bfa"
  маркер: "#ffd60a"
  зелёный: "#34c759"
  контур: "#0f0a2a"
  глубина: "#3a2a7a"
  сталь: "#9a8cc9"

субтитры:
  цвет: "#fff3d6"
  обводка: "#0f0a2a"

эффекты:
  зерно: false
  виньетка: 0

манера:
  комнаты_стиля: true   # тёмные комнаты эпизода или серии берут стены и пол этого стиля
  линия: 1.8
  рывки: 12
  ширина_головы: 1.06
  высота_головы: 0.96
  тело: 1.1
  шея: 0.9

офис:
  стена: "#3a2a7a"
  низ_стены: "#2a1c66"
  потолок: "#1b1442"
  пол: "#ff7a45"
  низ_пола: "#e8552a"
  окно_верх: "#ffd60a"
  окно_низ: "#ff9f43"
  здания: "#2a1c66"

анимации:
  характер: резкий
  входы: [падение, слева, справа, зум]
  переходы: [рывок, вспышка, склейка, зум]
  камера: [наезд, отъезд]
  амплитуда_камеры: 0.03
  реакция: 0.06

комнаты:
  комната: {стена: "#3a2a7a", низ_стены: "#2a1c66", пол: "#ff7a45", низ_пола: "#e8552a", свет: "#fff3d6", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#0e6f78", низ_стены: "#0a4f5a", пол: "#ffc300", низ_пола: "#e0a800", свет: "#fff3d6", трубы: false, узор: 4}
