# Стиль «Плакат»: три цвета и жирный контур, как на трафаретном плакате. Ступенчатая анимация, без зерна и виньетки.
название: Плакат

палитра:                  # при тонах важна только яркость: средний серый станет красным (настоящий красный тёмный и ушёл бы в чёрное)
  тёмный: "#17131b"
  светлый: "#f3e7cf"
  красный: "#9c8f86"
  акцент: "#9c8f86"
  приглушённый: "#f3e7cf"
  маркер: "#f3e7cf"
  зелёный: "#9c8f86"
  контур: "#17131b"
  глубина: "#9c8f86"
  сталь: "#f3e7cf"

субтитры:
  цвет: "#f3e7cf"
  обводка: "#17131b"

эффекты:
  зерно: false
  виньетка: 0

манера:
  комнаты_стиля: true   # тёмные комнаты эпизода или серии берут стены и пол этого стиля
  линия: 1.8
  рывки: 12
  тона: ["#17131b", "#e0222f", "#f3e7cf"]
  ширина_головы: 1.06
  высота_головы: 0.96
  тело: 1.1
  шея: 0.9

офис:                  # стены в средней яркости становятся красными, пол и окна — кремовыми, фигуры остаются чёрными
  стена: "#9c8f86"
  низ_стены: "#9c8f86"
  потолок: "#17131b"
  пол: "#f3e7cf"
  низ_пола: "#f3e7cf"
  окно_верх: "#f3e7cf"
  окно_низ: "#f3e7cf"
  здания: "#17131b"

анимации:
  входы: [падение, слева, справа, зум]
  переходы: [рывок, сдвиг, склейка]
  камера: [наезд, отъезд]
  амплитуда_камеры: 0.03
  реакция: 0.06

комнаты:
  комната: {стена: "#9c8f86", низ_стены: "#9c8f86", пол: "#f3e7cf", низ_пола: "#f3e7cf", свет: "#ffffff", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#9c8f86", низ_стены: "#9c8f86", пол: "#f3e7cf", низ_пола: "#f3e7cf", свет: "#ffffff", трубы: false, узор: 4}
