# Стиль «Светлый мультик»: яркие плоские цвета, без зерна и виньетки, субтитры белые с тёмной обводкой.
# Тот же эпизод в другом стиле: поменяйте строку «стиль» в episode.yaml на light-cartoon.
название: Светлый мультик

палитра:
  тёмный: "#fef3c7"
  светлый: "#1e293b"
  красный: "#e11d48"
  акцент: "#2563eb"
  приглушённый: "#64748b"
  маркер: "#f59e0b"
  зелёный: "#16a34a"
  контур: "#1e293b"
