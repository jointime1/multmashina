# Стиль «Светлый мультик»: яркие плоские цвета, без зерна и виньетки, субтитры белые с тёмной обводкой.
# Тот же эпизод в другом стиле: поменяйте строку «стиль» в episode.yaml на light-cartoon.
название: Светлый мультик

палитра:
  тёмный: "#fef3c7"
  светлый: "#1e293b"
  красный: "#e11d48"
  акцент: "#2563eb"
  приглушённый: "#64748b"
  маркер: "#f59e0b"
  зелёный: "#16a34a"
  контур: "#1e293b"
  глубина: "#bfdbfe"
  сталь: "#94a3b8"

субтитры:
  цвет: "#ffffff"
  обводка: "#1e293b"

эффекты:
  зерно: false
  виньетка: 0

офис:
  стена: "#e0f2fe"
  низ_стены: "#bae6fd"
  потолок: "#cbd5e1"
  пол: "#fde68a"
  окно_верх: "#7dd3fc"
  окно_низ: "#e0f2fe"
  здания: "#94a3b8"

# ---------- движение ----------
# Всё по кругу и детерминированно: соседние надписи и сцены не повторяют друг друга. Убрать — удалить раздел или поставить [] / 0.
анимации:
  входы: [всплытие, падение, слева, справа, подъём, зум]   # как появляются слова, ярлыки и иконки (штамп всегда хлопает)
  переходы: [рывок, вспышка, зум, сдвиг]                    # между сценами; ещё: затемнение, склейка (без перехода)
  камера: [наезд, влево, отъезд, вправо]                     # медленное движение плана на каждой сцене; стоп — без движения
  амплитуда_камеры: 0.04
  реакция: 0.05                                              # герой вздрагивает, когда меняется эмоция (0 — выключить)

комнаты:
  комната: {стена: "#bae6fd", низ_стены: "#e0f2fe", пол: "#fde68a", свет: "#fef9c3", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#fecdd3", низ_стены: "#ffe4e6", пол: "#fcd34d", свет: "#fef9c3", узор: 4}
