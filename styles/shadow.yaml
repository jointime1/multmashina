# Стиль «Силуэт»: театр теней в цвете. Фигуры залиты глубоким цветом героя с яркой контровой каймой, глаза, рот и очки светятся тем же оттенком.
# Закат, глубокие тени, медленные панорамы и затемнения между сценами. Играют позой: качаются на палочке, руки вскидываются, глаза косеют.
название: Силуэт

палитра:
  тёмный: "#ff9a56"
  светлый: "#2a0f3d"
  красный: "#e4405f"
  акцент: "#7a2cbf"
  приглушённый: "#b96ab0"
  маркер: "#2a0f3d"
  зелёный: "#2a9d8f"
  контур: "#2a0f3d"
  глубина: "#f4695f"
  сталь: "#b96ab0"

субтитры:
  цвет: "#fff7e0"
  обводка: "#2a0f3d"

эффекты:
  зерно: false
  виньетка: 0.25

манера:
  персонаж: силуэт        # сплошная фигура цвета героя, светятся глаза, рот, брови и очки
  комнаты_стиля: true
  плоско: true
  дрожь: 0.8              # край вырезан из картона: чуть неровный
  мелкость: 0.03
  смена_дрожи: 4

офис:
  стена: "#ffa45c"
  низ_стены: "#f4695f"
  потолок: "#7a2fa0"
  пол: "#d9568f"
  низ_пола: "#a83a7a"
  окно_верх: "#ffe08a"
  окно_низ: "#ffb066"
  здания: "#8a3fa8"

анимации:
  характер: плавный
  входы: [подъём, слева, справа, всплытие]
  переходы: [затемнение, склейка]
  камера: [вправо, влево, наезд]      # медленно ведёт по сцене, как подсвеченный экран
  амплитуда_камеры: 0.05
  реакция: 0.04

комнаты:
  комната: {стена: "#ffa45c", низ_стены: "#f4695f", пол: "#d9568f", низ_пола: "#a83a7a", свет: "#fff0b8", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#e8587a", низ_стены: "#a83a7a", пол: "#7a2f8a", низ_пола: "#5a1f70", свет: "#ffd36e", узор: 4}
