# Стиль «Силуэт»: театр теней. Фигуры залиты одной тушью, сквозь прорези глаз, рта и очков виден золотой фон. Играют позой: качаются на палочке,
# руки вскидываются, глаза косеют от злости. Движение плавное и неторопливое, между сценами затемнение.
# Прорези рисуются цветом «тёмный» палитры, поэтому он здесь светлый (как в тетради): так глаза светятся на чёрном.
название: Силуэт

палитра:
  тёмный: "#f7c25a"
  светлый: "#1b1008"
  красный: "#b23a12"
  акцент: "#7a2e0e"
  приглушённый: "#a4682b"
  маркер: "#1b1008"
  зелёный: "#5a3a14"
  контур: "#1b1008"
  глубина: "#e89a3c"
  сталь: "#a4682b"

субтитры:
  цвет: "#1b1008"
  обводка: "#f7c25a"

эффекты:
  зерно: false
  виньетка: 0.25

манера:
  персонаж: силуэт        # сплошная фигура, светятся только глаза, рот, брови и очки
  комнаты_стиля: true
  плоско: true
  дрожь: 0.8              # край вырезан из картона: чуть неровный
  мелкость: 0.03
  смена_дрожи: 4

офис:
  стена: "#f7c25a"
  низ_стены: "#eea943"
  потолок: "#d98a2f"
  пол: "#e8a03a"
  низ_пола: "#d98a2f"
  окно_верх: "#fbe3a1"
  окно_низ: "#f7c25a"
  здания: "#c8832d"

анимации:
  характер: плавный
  входы: [подъём, слева, справа, всплытие]
  переходы: [затемнение, склейка]
  камера: [вправо, влево, наезд]      # медленно ведёт по сцене, как подсвеченный экран
  амплитуда_камеры: 0.05
  реакция: 0.04

комнаты:
  комната: {стена: "#f7c25a", низ_стены: "#eea943", пол: "#e8a03a", низ_пола: "#d98a2f", свет: "#fff0b8", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#eea943", низ_стены: "#d98a2f", пол: "#d98a2f", низ_пола: "#c2751f", свет: "#ffe08a", узор: 4}
