# Стиль «Тёмный двор»: тёмные облупленные помещения с лампой на шнуре, неон, зерно и виньетка, жёлтые субтитры.
# Цвета — в формате "#rrggbb" (в кавычках). Любой раздел можно не указывать: подставится значение по умолчанию.
название: Тёмный двор

сцена:               # размер кадра в условных единицах; 900×1600 — вертикальное видео 9:16
  ширина: 900
  высота: 1600

палитра:
  тёмный: "#0b1220"          # фон кадра
  светлый: "#f1f5f9"
  красный: "#ff3b3b"         # отказы, штампы, зачёркивание
  акцент: "#38bdf8"          # главный цвет бренда эпизода
  приглушённый: "#94a3b8"
  маркер: "#ffd23f"          # субтитры, маркер, штампы
  зелёный: "#22c55e"
  контур: "#12141c"          # толстые контуры героев
  глубина: "#0c4a6e"
  сталь: "#94a3b8"

шрифты:
  заголовки: Oswald          # файлы лежат в fonts/ (лицензия OFL)
  запасные: Arial Narrow, sans-serif
  моно: Menlo, "SF Mono", "Courier New", monospace
  подгрузить: ["700 40px Oswald", "500 40px Oswald"]
  файлы: ["fonts/oswald.css"]

субтитры:
  y: 1228            # высота; ниже 1300 кадр закрывают кнопки платформы
  размер: 72
  цвет: "#ffd23f"
  обводка: "#0b0d14"
  слов: 3            # не больше слов за раз
  знаков: 22
  пауза: 0.45        # пауза между словами длиннее — начинается новая группа
  ширина: 700

эффекты:
  зерно: true
  виньетка: 0.5      # 0 — выключить
  опережение: 0.22   # картинка опережает слово на столько секунд
  пауза_после_бита: 0.6

# ---------- комнаты ----------
комнаты:
  комната:           # холодная комната героя с голубой лампой
    стена: "#2b3850"
    низ_стены: "#16202f"
    пол: "#171c28"
    свет: "#7dd3fc"
    лампа_x: 760
    трубы: false
    узор: 3
  подвал:            # тёплый подвал с трубами
    узор: 4
