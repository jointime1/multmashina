# Стиль «Классика»: большая рисованная студийная анимация. Сказочные насыщенные фоны с мягкими градиентами и тёплым светом, герои с лепкой светом и тенью,
# цветной линией и крупными блестящими глазами. Движение по правилам старых мастеров: подготовка перед реакцией, пружина и инерция после, дыхание и живой взгляд в покое.
название: Классика

палитра:
  тёмный: "#2b3a7a"
  светлый: "#fff6e0"
  красный: "#e63946"
  акцент: "#2ec4b6"
  приглушённый: "#a8b2d1"
  маркер: "#ffc857"
  зелёный: "#52b788"
  контур: "#2b1a2e"
  глубина: "#6a8fd6"
  сталь: "#a8b2d1"

субтитры:
  цвет: "#fff6e0"
  обводка: "#2b1a2e"

эффекты:
  зерно: false
  виньетка: 0.45

манера:
  персонаж: классика      # лепка светом, цветная линия, блестящие глаза, подготовка и инерция
  комнаты_стиля: true
  фактура: гуашь          # лёгкая живопись поверх кадра
  сила_фактуры: 0.35

офис:
  стена: "#4b6cb7"
  низ_стены: "#2f4a8a"
  потолок: "#1f2f66"
  пол: "#d19a52"
  низ_пола: "#a8702f"
  окно_верх: "#ffd37a"
  окно_низ: "#ff9f5a"
  здания: "#2a3b78"

анимации:
  характер: пружина       # всё, что выпрыгивает, раскачивается вокруг цели
  входы: [всплытие, падение, вращение, подъём]
  переходы: [затемнение, зум, сдвиг, затемнение]
  камера: [наезд, вправо, отъезд, влево]      # медленные «мультипланочные» проезды
  амплитуда_камеры: 0.06
  реакция: 0.08

комнаты:
  комната: {стена: "#5a7fc9", низ_стены: "#3a5aa3", пол: "#d9a35c", низ_пола: "#a8702f", свет: "#ffe9a8", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#6a4a9a", низ_стены: "#47307a", пол: "#c9843f", низ_пола: "#8f5a24", свет: "#ffd9a0", узор: 4}
