# Стиль «Союзмульт»: рисованный мультфильм советской студии. Фоны гуашью с пятнами краски и бумажным зерном, тёплая землистая палитра,
# коричневая тушь вместо чёрной, живая дрожащая линия, 12 кадров в секунду (на двойках), мягкие переходы и неторопливая камера, плёночное зерно.
название: Союзмульт

палитра:
  тёмный: "#efe1c0"
  светлый: "#2b1d14"
  красный: "#b5412f"
  акцент: "#3f6f8f"
  приглушённый: "#8c7a5e"
  маркер: "#c9892b"
  зелёный: "#5b7f3a"
  контур: "#2b1d14"
  глубина: "#a9c3b1"
  сталь: "#8c7a5e"

субтитры:
  цвет: "#fff3d6"
  обводка: "#2b1d14"

эффекты:
  зерно: true
  виньетка: 0.5

манера:
  комнаты_стиля: true
  персонаж: обычный       # обычный герой, но с руками: они играют эмоцию
  руки: true
  фактура: гуашь          # пятна краски и бумажное зерно поверх кадра
  сила_фактуры: 0.7
  линия: 1.1
  дрожь: 1.2              # линия живая: перерисована от руки
  мелкость: 0.02
  смена_дрожи: 6
  рывки: 12               # рисовали «на двойках»: 12 разных кадров в секунду
  ширина_головы: 1.08
  тело: 1.0

офис:
  стена: "#e6cf94"
  низ_стены: "#b9a06a"
  потолок: "#d8c9a5"
  пол: "#8a6a45"
  низ_пола: "#6b4f32"
  окно_верх: "#b8d3d9"
  окно_низ: "#e6ecde"
  здания: "#9a8b6a"

анимации:
  характер: плавный
  входы: [подъём, слева, справа, всплытие]
  переходы: [затемнение, склейка, зум, склейка]
  камера: [вправо, наезд, влево, стоп]      # неторопливая «мультипланка»
  амплитуда_камеры: 0.04
  реакция: 0.04

комнаты:
  комната: {стена: "#e6cf94", низ_стены: "#b8995b", пол: "#8a6a45", низ_пола: "#6b4f32", свет: "#fff0c2", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#a9b59a", низ_стены: "#6f8a63", пол: "#6b5a45", низ_пола: "#4a3d2e", свет: "#f3e3b0", узор: 4}
