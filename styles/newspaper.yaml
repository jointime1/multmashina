# Стиль «Газета»: цветной комикс на газетной бумаге, точечный растр поверх красок. Лёгкая дрожь, как при плохой печати, ровный механический ход.
название: Газета

палитра:
  тёмный: "#f7edd2"
  светлый: "#1a1a1a"
  красный: "#e4002b"
  акцент: "#0057b8"
  приглушённый: "#8a8570"
  маркер: "#e4002b"
  зелёный: "#00843d"
  контур: "#1a1a1a"
  глубина: "#b7d3ea"
  сталь: "#8a8570"

субтитры:
  цвет: "#fffbea"
  обводка: "#1a1a1a"

эффекты:
  зерно: false
  виньетка: 0

манера:
  комнаты_стиля: true   # тёмные комнаты эпизода или серии берут стены и пол этого стиля
  линия: 1.3
  дрожь: 1
  мелкость: 0.03
  смена_дрожи: 8
  рывки: 10
  растр: 12

офис:
  стена: "#cfe3f2"
  низ_стены: "#b0cfe6"
  потолок: "#e8c872"
  пол: "#e8d28a"
  низ_пола: "#cdb25a"
  окно_верх: "#f7edd2"
  окно_низ: "#cfe3f2"
  здания: "#d9776a"

анимации:
  характер: механика
  входы: [слева, справа]
  переходы: [склейка, склейка, рывок]
  камера: [наезд, стоп]
  амплитуда_камеры: 0.03
  реакция: 0.05

комнаты:
  комната: {стена: "#cfe3f2", низ_стены: "#b0cfe6", пол: "#e8d28a", низ_пола: "#cdb25a", свет: "#fffbea", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#e9b8b0", низ_стены: "#d9958a", пол: "#c9d6a0", низ_пола: "#a9b97a", свет: "#fffbea", узор: 4}
