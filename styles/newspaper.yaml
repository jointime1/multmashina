# Стиль «Газета»: чёрная краска и точечный растр на серой бумаге. Лёгкая дрожь, как при плохой печати.
название: Газета

палитра:
  тёмный: "#e9e6dc"
  светлый: "#16161a"
  красный: "#8a8a8f"
  акцент: "#16161a"
  приглушённый: "#6b6b70"
  маркер: "#16161a"
  зелёный: "#16161a"
  контур: "#16161a"
  глубина: "#b8b6ad"
  сталь: "#8a8a8f"

субтитры:             # светлый текст с тёмной обводкой: на точках растра он читается лучше тёмного
  цвет: "#e9e6dc"
  обводка: "#16161a"

эффекты:
  зерно: false
  виньетка: 0

манера:
  комнаты_стиля: true   # тёмные комнаты эпизода или серии берут стены и пол этого стиля
  линия: 1.3
  дрожь: 1
  мелкость: 0.03
  смена_дрожи: 8
  рывки: 10
  тона: ["#16161a", "#e9e6dc"]
  растр: 12

офис:
  стена: "#c7c5bb"
  низ_стены: "#a9a79e"
  потолок: "#8a8a8f"
  пол: "#b8b6ad"
  низ_пола: "#8a8a8f"
  окно_верх: "#e9e6dc"
  окно_низ: "#c7c5bb"
  здания: "#6b6b70"

анимации:
  входы: [падение, слева, справа, зум]
  переходы: [склейка, рывок]
  камера: [наезд, отъезд]
  амплитуда_камеры: 0.03
  реакция: 0.05

комнаты:
  комната: {стена: "#b8b6ad", низ_стены: "#8a8a8f", пол: "#8a8a8f", низ_пола: "#6b6b70", свет: "#e9e6dc", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#a9a79e", низ_стены: "#6b6b70", пол: "#8a8a8f", низ_пола: "#6b6b70", свет: "#e9e6dc", узор: 4}
