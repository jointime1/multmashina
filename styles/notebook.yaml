# Стиль «Тетрадь»: рисунок шариковой ручкой на бумаге. Линия дрожит, анимация идёт рывками, лица простые: глаза-точки, голова вытянута.
название: Тетрадь

палитра:
  тёмный: "#fbf8ee"
  светлый: "#1b2a6b"
  красный: "#7d8fc4"
  акцент: "#1b2a6b"
  приглушённый: "#7d8fc4"
  маркер: "#1b2a6b"
  зелёный: "#1b2a6b"
  контур: "#16225a"
  глубина: "#dfe5f5"
  сталь: "#7d8fc4"

субтитры:
  цвет: "#16225a"
  обводка: "#fbf8ee"

эффекты:
  зерно: false
  виньетка: 0

манера:
  персонаж: каракуля    # линейный человечек: руки играют эмоцию
  комнаты_стиля: true   # тёмные комнаты эпизода или серии берут стены и пол этого стиля
  линия: 0.7
  дрожь: 2.5
  мелкость: 0.018
  смена_дрожи: 6
  рывки: 8
  тона: ["#16225a", "#7d8fc4", "#7d8fc4", "#fbf8ee"]   # от тёмного к светлому: ручка, штриховка, бумага; цвет можно повторить, чтобы сдвинуть порог
  бумага: клетка
  плоско: true
  глаза: точки
  ширина_головы: 0.9
  высота_головы: 1.08
  тело: 0.8

офис:
  стена: "#fbf8ee"
  низ_стены: "#f3efe0"
  потолок: "#e9e4d2"
  пол: "#f3efe0"
  низ_пола: "#f3efe0"
  окно_верх: "#fbf8ee"
  окно_низ: "#efeadb"
  здания: "#b9c3e2"

анимации:
  характер: резкий         # движения долетают почти мгновенно и садятся коротко, как рисуют ручкой
  входы: [подъём, слева, падение, справа]
  переходы: [склейка, склейка, сдвиг]   # в тетради страницы не перелистывают плавно: склейка
  камера: []
  реакция: 0.06

комнаты:
  комната: {стена: "#fbf8ee", низ_стены: "#f3efe0", пол: "#efeadb", низ_пола: "#efeadb", свет: "#fbf8ee", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#f3efe0", низ_стены: "#e9e4d2", пол: "#e9e4d2", низ_пола: "#e9e4d2", свет: "#fbf8ee", узор: 4}
