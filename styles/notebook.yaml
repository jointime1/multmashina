# Стиль «Тетрадь»: рисунок цветными маркерами и ручкой на листе в клетку. Линия дрожит, анимация идёт резко, лица простые: глаза-точки, голова вытянута, руки играют эмоцию.
название: Тетрадь

палитра:
  тёмный: "#fffdf4"
  светлый: "#23305e"
  красный: "#e63946"
  акцент: "#2a7de1"
  приглушённый: "#8b95b8"
  маркер: "#e8590c"
  зелёный: "#2fa84f"
  контур: "#23305e"
  глубина: "#cfe3ff"
  сталь: "#8b95b8"

субтитры:
  цвет: "#23305e"
  обводка: "#fffdf4"

эффекты:
  зерно: false
  виньетка: 0

манера:
  персонаж: каракуля    # линейный человечек: руки играют эмоцию
  комнаты_стиля: true   # тёмные комнаты эпизода или серии берут стены и пол этого стиля
  линия: 0.7
  дрожь: 2.5
  мелкость: 0.018
  смена_дрожи: 6
  рывки: 8
  бумага: клетка
  плоско: true
  глаза: точки
  ширина_головы: 0.9
  высота_головы: 1.08
  тело: 0.8

офис:
  стена: "#fff6dc"
  низ_стены: "#fde8a8"
  потолок: "#ffd6e0"
  пол: "#c9ecc6"
  низ_пола: "#a9dfa6"
  окно_верх: "#bfe3ff"
  окно_низ: "#e4f3ff"
  здания: "#ff9e9e"

анимации:
  характер: резкий         # движения долетают почти мгновенно и садятся коротко, как рисуют ручкой
  входы: [подъём, слева, падение, справа]
  переходы: [склейка, склейка, сдвиг]   # в тетради страницы не перелистывают плавно: склейка
  камера: []
  реакция: 0.06

комнаты:
  комната: {стена: "#fff6dc", низ_стены: "#fde8a8", пол: "#c9ecc6", низ_пола: "#a9dfa6", свет: "#fffdf4", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#e4d8ff", низ_стены: "#cdbdf5", пол: "#ffd9a8", низ_пола: "#f5c27a", свет: "#fffdf4", узор: 4}
