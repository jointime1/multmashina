# Стиль «Желе»: мармеладные цвета, толстый мягкий контур, герои-колобки. Всё пружинит: выход, реакция, камера, ходьба прыжками.
# Движение плавное (30 кадров в секунду): характер — пружина, а не рывки.
название: Желе

палитра:
  тёмный: "#ffd9ec"
  светлый: "#3b1d5a"
  красный: "#ff4d6d"
  акцент: "#7c3aed"
  приглушённый: "#a78bfa"
  маркер: "#ea580c"
  зелёный: "#2dd4a4"
  контур: "#3b1d5a"
  глубина: "#bde0fe"
  сталь: "#a78bfa"

субтитры:
  цвет: "#ffffff"
  обводка: "#3b1d5a"

эффекты:
  зерно: false
  виньетка: 0

манера:
  персонаж: желе          # колобок: тело сжимается и вытягивается, в покое колышется
  комнаты_стиля: true
  линия: 1.25
  плоско: true

офис:
  стена: "#ffe8f3"
  низ_стены: "#ffd0e6"
  потолок: "#e9d5ff"
  пол: "#fff1b8"
  низ_пола: "#ffe08a"
  окно_верх: "#a5d8ff"
  окно_низ: "#e0f2fe"
  здания: "#c4b5fd"

анимации:
  характер: пружина        # всё, что выпрыгивает, раскачивается вокруг цели
  входы: [падение, вращение, всплытие, зум]
  переходы: [рывок, зум, сдвиг]
  камера: [наезд, отъезд, вправо, влево]
  амплитуда_камеры: 0.05
  реакция: 0.08

комнаты:
  комната: {стена: "#bde0fe", низ_стены: "#e0f2fe", пол: "#fff1b8", низ_пола: "#ffe08a", свет: "#fff7cc", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#e9d5ff", низ_стены: "#f3e8ff", пол: "#ffe08a", низ_пола: "#ffd166", свет: "#fff7cc", узор: 4}
