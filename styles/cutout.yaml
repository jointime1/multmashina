# Стиль «Вырезная бумага»: куклы вырезаны из цветной бумаги, как в «Южном парке». Огромные головы, глаза-овалы вплотную друг к другу, парка и варежки,
# тонкий чёрный контур и мягкая тень под каждой деталью, бумажное зерно. Детали жёсткие, но двигаются плавно и линейно, как куклу ведут по столу; рот хлопает при речи.
название: Вырезная бумага

палитра:
  тёмный: "#9bd0f0"
  светлый: "#20304f"
  красный: "#e4572e"
  акцент: "#2e86ab"
  приглушённый: "#5c6b73"
  маркер: "#e4572e"
  зелёный: "#4c9f70"
  контур: "#111111"
  глубина: "#2e86ab"
  сталь: "#9db4c0"

субтитры:
  цвет: "#ffffff"
  обводка: "#111111"

эффекты:
  зерно: false
  виньетка: 0

манера:
  персонаж: вырезка     # бумажные детали на шарнирах, готовые рты и веки
  комнаты_стиля: true   # тёмные комнаты эпизода или серии берут стены и пол этого стиля
  фактура: бумага       # бумажное зерно поверх кадра
  сила_фактуры: 0.8
  линия: 1
  плоско: true

офис:
  стена: "#f7c548"
  низ_стены: "#f0a93b"
  потолок: "#e4572e"
  пол: "#4c9f70"
  низ_пола: "#4c9f70"
  окно_верх: "#9bd8e8"
  окно_низ: "#d7f0f5"
  здания: "#2e86ab"

анимации:
  характер: механика       # линейное движение без разгона и перелёта, как куклу ведут по столу
  входы: [слева, справа]
  переходы: [склейка, сдвиг]
  камера: []
  реакция: 0.08

комнаты:
  комната: {стена: "#f7c548", низ_стены: "#f0a93b", пол: "#4c9f70", низ_пола: "#4c9f70", свет: "#fff3c4", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#2e86ab", низ_стены: "#20607c", пол: "#20304f", низ_пола: "#20304f", свет: "#fff3c4", узор: 4}
