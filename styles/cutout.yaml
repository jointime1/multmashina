# Стиль «Аппликация»: фигуры вырезаны из цветной бумаги. Обводки нет, кромка рваная, движение крупными рывками.
название: Аппликация

палитра:
  тёмный: "#f7c548"
  светлый: "#20304f"
  красный: "#e4572e"
  акцент: "#2e86ab"
  приглушённый: "#5c6b73"
  маркер: "#e4572e"
  зелёный: "#4c9f70"
  контур: "#20304f"
  глубина: "#2e86ab"
  сталь: "#9db4c0"

субтитры:
  цвет: "#ffffff"
  обводка: "#20304f"

эффекты:
  зерно: false
  виньетка: 0

манера:
  персонаж: марионетка  # бумажные детали на шарнирах, готовые рты и веки
  комнаты_стиля: true   # тёмные комнаты эпизода или серии берут стены и пол этого стиля
  линия: 0
  дрожь: 1.2
  мелкость: 0.06
  смена_дрожи: 3
  рывки: 6
  плоско: true
  глаза: точки
  ширина_головы: 1.1
  высота_головы: 0.92
  тело: 0.72

офис:
  стена: "#f7c548"
  низ_стены: "#f0a93b"
  потолок: "#e4572e"
  пол: "#4c9f70"
  низ_пола: "#4c9f70"
  окно_верх: "#9bd8e8"
  окно_низ: "#d7f0f5"
  здания: "#2e86ab"

анимации:
  характер: механика       # линейное движение без разгона и перелёта, как куклу ведут по столу
  входы: [слева, справа]
  переходы: [склейка, сдвиг]
  камера: []
  реакция: 0.08

комнаты:
  комната: {стена: "#f7c548", низ_стены: "#f0a93b", пол: "#4c9f70", низ_пола: "#4c9f70", свет: "#fff3c4", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#2e86ab", низ_стены: "#20607c", пол: "#20304f", низ_пола: "#20304f", свет: "#fff3c4", узор: 4}
