# Стиль «Пиксель»: восьмибитная игра. Герои из квадратов сетки, рты и позы рук готовыми спрайтами, весь кадр склеен в крупные точки,
# четыре оттенка зелёного как на старой портативной консоли, 8 кадров в секунду.
# Цвета палитры здесь «до фильтра»: тона выбирает яркость точки (до 25% — тушь, 25–50% — тёмный, 50–75% — светлый, выше — фон).
название: Пиксель

палитра:
  тёмный: "#e0f0b0"
  светлый: "#0f380f"
  красный: "#306230"
  акцент: "#306230"
  приглушённый: "#8bac0f"
  маркер: "#0f380f"
  зелёный: "#306230"
  контур: "#0f380f"
  глубина: "#8bac0f"
  сталь: "#8bac0f"

субтитры:
  цвет: "#0f380f"
  обводка: "#9bbc0f"

эффекты:
  зерно: false
  виньетка: 0

манера:
  персонаж: пиксель       # герой из квадратов сетки, спрайты вместо плавных переходов
  комнаты_стиля: true
  плоско: true
  пиксели: 5              # клетка кадра в единицах сцены; кратна 5, тогда в видео 1080 px она целая (6 px). Мельче клетка: надписи читаются; крупнее: мелкий текст расползается
  рывки: 8
  тона: ["#0f380f", "#306230", "#8bac0f", "#9bbc0f"]

офис:
  стена: "#c4d98a"
  низ_стены: "#c4d98a"
  потолок: "#306230"
  пол: "#8bac0f"
  низ_пола: "#8bac0f"
  окно_верх: "#e0f0b0"
  окно_низ: "#c4d98a"
  здания: "#8bac0f"

анимации:
  характер: резкий
  входы: [слева, справа, подъём, падение]
  переходы: [склейка, сдвиг, склейка]
  камера: []
  реакция: 0.05

комнаты:
  комната: {стена: "#c4d98a", низ_стены: "#c4d98a", пол: "#8bac0f", низ_пола: "#8bac0f", свет: "#e0f0b0", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#8bac0f", низ_стены: "#8bac0f", пол: "#306230", низ_пола: "#306230", свет: "#c4d98a", узор: 4}
