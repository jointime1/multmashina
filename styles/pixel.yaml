# Стиль «Пиксель»: игра в 16 бит. Герои из квадратов сетки, рты и позы рук готовыми спрайтами, весь кадр склеен в клетки,
# яркие чистые цвета, 8 кадров в секунду.
название: Пиксель

палитра:
  тёмный: "#6ec1ff"
  светлый: "#1b1f3b"
  красный: "#ff4d6d"
  акцент: "#7b61ff"
  приглушённый: "#9aa5d1"
  маркер: "#ffd23f"
  зелёный: "#3ddc84"
  контур: "#1b1f3b"
  глубина: "#2b3a67"
  сталь: "#9aa5d1"

субтитры:
  цвет: "#ffffff"
  обводка: "#1b1f3b"

эффекты:
  зерно: false
  виньетка: 0

манера:
  персонаж: пиксель       # герой из квадратов сетки, спрайты вместо плавных переходов
  комнаты_стиля: true
  плоско: true
  пиксели: 5              # клетка кадра в единицах сцены; кратна 5, тогда в видео 1080 px она целая (6 px). Мельче клетка: надписи читаются; крупнее: мелкий текст расползается
  рывки: 8

офис:
  стена: "#8fd3ff"
  низ_стены: "#6ec1ff"
  потолок: "#3a4a8a"
  пол: "#5ac06b"
  низ_пола: "#3f9a52"
  окно_верх: "#ffe27a"
  окно_низ: "#8fd3ff"
  здания: "#5b6fb5"

анимации:
  характер: резкий
  входы: [слева, справа, подъём, падение]
  переходы: [склейка, сдвиг, склейка]
  камера: []
  реакция: 0.05

комнаты:
  комната: {стена: "#8fd3ff", низ_стены: "#6ec1ff", пол: "#5ac06b", низ_пола: "#3f9a52", свет: "#fff7c2", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#6a4fd6", низ_стены: "#4a3aa0", пол: "#ffb347", низ_пола: "#e08a1e", свет: "#ffe27a", узор: 4}
