# Стиль «Резиновый шланг»: чёрно-белые мультфильмы 1930-х. Герои с руками-макаронами и глазами с вырезом, всё пляшет в такт даже без реплик,
# плёнка дрожит. Три тона (тушь, серый, бумага), 12 кадров в секунду, пружинящее движение.
название: Резиновый шланг

палитра:
  тёмный: "#e9e0c8"
  светлый: "#14110f"
  красный: "#14110f"
  акцент: "#14110f"
  приглушённый: "#8a8272"
  маркер: "#14110f"
  зелёный: "#14110f"
  контур: "#14110f"
  глубина: "#8a8272"
  сталь: "#8a8272"

субтитры:
  цвет: "#f3ead0"
  обводка: "#14110f"

эффекты:
  зерно: true
  виньетка: 0.6

манера:
  персонаж: шланг         # макароны вместо рук, глаза с вырезом, прыжок в такт
  комнаты_стиля: true
  плоско: true
  линия: 1.2
  дрожь: 1.3              # плёнка «кипит»: линия перерисовывается 12 раз в секунду
  мелкость: 0.02
  смена_дрожи: 12
  рывки: 12
  тона: ["#14110f", "#8a8272", "#e9e0c8"]

офис:
  стена: "#d9d0b6"
  низ_стены: "#cfc6ad"
  потолок: "#9a917c"
  пол: "#9a917c"
  низ_пола: "#8a8272"
  окно_верх: "#e9e0c8"
  окно_низ: "#d9d0b6"
  здания: "#9a917c"

анимации:
  характер: пружина
  входы: [падение, зум, вращение, слева]
  переходы: [склейка, зум, склейка]
  камера: [наезд, отъезд]
  амплитуда_камеры: 0.03
  реакция: 0.06

комнаты:
  комната: {стена: "#d9d0b6", низ_стены: "#cfc6ad", пол: "#9a917c", низ_пола: "#8a8272", свет: "#f3ead0", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#cfc6ad", низ_стены: "#b8af95", пол: "#8a8272", низ_пола: "#7a7262", свет: "#e9e0c8", узор: 4}
