# Стиль «Резиновый шланг»: цветные мультфильмы 1930-х. Герои с руками-макаронами и глазами с вырезом, всё пляшет в такт даже без реплик,
# плёнка дрожит и шумит. Тёплая красочная палитра, 12 кадров в секунду, пружинящее движение.
название: Резиновый шланг

палитра:
  тёмный: "#f6e7bf"
  светлый: "#1a1210"
  красный: "#d62828"
  акцент: "#1d4e89"
  приглушённый: "#a68a64"
  маркер: "#f7b32b"
  зелёный: "#2a9d8f"
  контур: "#1a1210"
  глубина: "#8ecae6"
  сталь: "#a68a64"

субтитры:
  цвет: "#fff4d6"
  обводка: "#1a1210"

эффекты:
  зерно: true
  виньетка: 0.55

манера:
  персонаж: шланг         # макароны вместо рук, глаза с вырезом, прыжок в такт
  комнаты_стиля: true
  плоско: true
  линия: 1.2
  дрожь: 1.3              # плёнка «кипит»: линия перерисовывается 12 раз в секунду
  мелкость: 0.02
  смена_дрожи: 12
  рывки: 12

офис:
  стена: "#f3d9a4"
  низ_стены: "#ecc982"
  потолок: "#d4a373"
  пол: "#2f7d95"
  низ_пола: "#1f5f78"
  окно_верх: "#8ecae6"
  окно_низ: "#cfeaf5"
  здания: "#e76f51"

анимации:
  характер: пружина
  входы: [падение, зум, вращение, слева]
  переходы: [склейка, зум, склейка]
  камера: [наезд, отъезд]
  амплитуда_камеры: 0.03
  реакция: 0.06

комнаты:
  комната: {стена: "#f3d9a4", низ_стены: "#ecc982", пол: "#2f7d95", низ_пола: "#1f5f78", свет: "#fff4d6", лампа_x: 760, трубы: false, узор: 3}
  подвал: {стена: "#e9b872", низ_стены: "#c98f4e", пол: "#7a3e48", низ_пола: "#5a2a34", свет: "#ffe3a0", узор: 4}
