# Эпизод «JobTurbo: слесарь, нахуй» — вымышленная история про айтишника Петю, которого сократили из «Шмяндекса».
# Реклама сервиса автооткликов JobTurbo в формате мем-рилса. Цифры (347 отказов, 99 приглашений из 100) вымышлены.
название: "JobTurbo: слесарь, нахуй"
стиль: dark-yard                 # styles/dark-yard.yaml; попробуйте light-cartoon
скрипты: [props.js, scenes.js]   # подключаются после движка, по порядку

озвучка:
  бэкенд: qwen-клон              # qwen-клон | qwen-дизайн | chatterbox | edge
  эталон: voice/ref.wav          # образец голоса для клона (сделан Qwen3-TTS VoiceDesign по описанию «пропитый мужик»)
  текст_эталона: Триста сорок семь отказов, блядь. Резюме ахуенное, как у сиИО. А всё равно не зовут.
  описание: >-
    A Russian man in his late 50s with a deep, rough, raspy voice of a lifelong heavy smoker and drinker. Low pitch, hoarse and gravelly,
    slightly slurred and lazy delivery, sarcastic, world-weary and comically deadpan. Speaks fast and casual, like telling a story at a bar.
  темп: 1.3                      # ускорение готовой записи без смены высоты голоса
  seed: 11

субтитры:
  замены:                        # как слово произносится → как показывать в субтитрах
    сиио: CEO

# ---------- герои эпизода (не зависят от стиля; стиль может их переопределить) ----------
герои:
  петя:
    кожа: "#f2c29b"
    волосы: "#3b2a20"
    очки: true
  hr:
    кожа: "#f6d3b3"
    волосы: "#7c2d12"
    пиджак: "#7f1d1d"
    длинные_волосы: true
    помада: "#be123c"
    очки: false
  охранник:
    пиджак: "#1f2937"
    кепка: "#111827"
    без_красного_носа: true
    очки: false
  коллега1: {кожа: "#f5d0b0", волосы: "#7c2d12", толстовка: "#334155", очки: false}
  коллега2: {кожа: "#e8b48a", волосы: "#1f2937", толстовка: "#7f1d1d", очки: true}
  коллега3: {кожа: "#f2c29b", волосы: "#6b7280", толстовка: "#14532d", очки: false}
  коллега4: {кожа: "#d9a37f", волосы: "#0f172a", толстовка: "#4c1d95", очки: true}
