# Эпизод «Не тот сервер» — короткая бытовая история для айтишников, без мата. Второй пример в светлом стиле (для сравнения с jobturbo).
название: "Не тот сервер"
стиль: light-cartoon
скрипты: [scenes.js]

озвучка:
  бэкенд: qwen-клон
  эталон: voice/ref.wav            # тот же синтетический голос, что в примере jobturbo
  текст_эталона: Триста сорок семь отказов, блядь. Резюме ахуенное, как у сиИО. А всё равно не зовут.
  темп: 1.3
  seed: 11

герои:
  вася: {кожа: "#f2c29b", волосы: "#5b3a29", очки: true, толстовка: "#2563eb"}
  начальник: {кожа: "#f6d3b3", волосы: "#6b7280", пиджак: "#334155", галстук: "#e11d48", очки: false}

комнаты:
  офис-вечер: {стена: "#c7d2fe", низ_стены: "#e0e7ff", пол: "#fde68a", свет: "#fef9c3", лампа_x: 810, трубы: false, узор: 7}

субтитры:
  замены: {}
