# Реплики по битам. Метки [[имя]] ставятся перед словом, на которое должна «попасть» картинка: в сценах m('имя').
биты:
  hook: "[[a]]Вася удалил базу. [[b]]Не ту."
  friday: "Пятница, [[six]]шесть вечера. Вася чистит тестовый стенд. [[same]]Окно терминала то же, что и вчера."
  oops: "[[cmd]]Команда ушла за секунду. [[done]]Терминал ответил: готово. [[luck]]Какое счастье, подумал Вася. [[prod]]Это был прод."
  monday: "В понедельник — [[boss]]совещание. Начальник спросил: [[bk]]бэкапы есть? [[was]]Вася ответил: были."
  outro: "[[rule]]Теперь Вася смотрит на название сервера. [[cv]]А в резюме у него написано: опыт работы с катастрофами."
